<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca | Préstamos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --ink: #17324d; --aqua: #0c8d87; --paper: #f4f7f6; --accent: #e5a93f; }
        body { background: var(--paper); color: var(--ink); font-family: Georgia, "Times New Roman", serif; }
        .navbar { background: var(--ink); }
        .brand-mark { color: var(--accent); font-weight: 700; letter-spacing: 1px; }
        .page-header { border-bottom: 3px solid var(--accent); }
        .panel { background: #fff; border: 1px solid #d9e1df; border-radius: 6px; box-shadow: 0 8px 20px rgb(23 50 77 / 8%); }
        .table thead th { color: #fff; background: var(--ink); white-space: nowrap; }
        .btn-primary { background: var(--aqua); border-color: var(--aqua); }
        .btn-primary:hover { background: #08736e; border-color: #08736e; }
        .form-control:focus, .form-select:focus { border-color: var(--aqua); box-shadow: 0 0 0 .2rem rgb(12 141 135 / 18%); }
        @media (max-width: 767px) { .table { font-size: .86rem; } }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand brand-mark" th:href="@{/vista/prestamos}">BIBLIOTECA</a>
            <span class="navbar-text text-white-50">Control de préstamos</span>
        </div>
    </nav>

    <main class="container pb-5">
        <header class="page-header d-flex justify-content-between align-items-end mb-4 pb-3">
            <div>
                <p class="text-uppercase small mb-1 text-secondary">Administracion</p>
                <h1 class="h2 mb-0">Préstamos</h1>
            </div>
            <span class="badge text-bg-light border" th:text="${#lists.size(prestamos)} + ' registrados'">0 registrados</span>
        </header>

        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert"><span th:text="${mensaje}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert"><span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>

        <div class="row g-4">
            <section class="col-lg-4">
                <div class="panel p-4">
                    <h2 class="h5 mb-3">Registrar préstamo</h2>
                    <form th:action="@{/vista/prestamos/guardar}" method="post">
                        <div class="mb-3"><label class="form-label" for="isbn">Libro</label><select id="isbn" class="form-select" name="isbn" required><option value="">Seleccionar libro</option><option th:each="libro : ${libros}" th:value="${libro.isbn}" th:text="${libro.titulo + ' - disponibles: ' + libro.numeroEjemplares}" th:disabled="${libro.numeroEjemplares == 0}"></option></select></div>
                        <div class="mb-4"><label class="form-label" for="personaId">Usuario</label><select id="personaId" class="form-select" name="personaId" required><option value="">Seleccionar usuario</option><option th:each="persona : ${personas}" th:value="${persona.id}" th:text="${persona.nombre + ' ' + persona.apellidos}"></option></select></div>
                        <button class="btn btn-primary w-100" type="submit">Registrar préstamo</button>
                    </form>
                </div>
            </section>

            <section class="col-lg-8">
                <div class="panel p-3 p-md-4">
                    <div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h5 mb-0">Historial</h2><input id="buscador" class="form-control form-control-sm w-auto" type="search" placeholder="Buscar préstamo"></div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0" id="tablaPrestamos">
                            <thead><tr><th>ID</th><th>Libro</th><th>Usuario</th><th>Fecha préstamo</th><th>Fecha devolución</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead>
                            <tbody>
                                <tr th:each="item : ${prestamos}">
                                    <td th:text="${item.id}"></td><td th:text="${item.libro.titulo}"></td><td th:text="${item.socio.nombre + ' ' + item.socio.apellidos}"></td><td th:text="${item.fechaPrestamo}"></td><td th:text="${item.fechaDevolucion != null ? item.fechaDevolucion : '-'}"></td><td><span class="badge" th:classappend="${item.fechaDevolucion == null ? 'text-bg-warning' : 'text-bg-success'}" th:text="${item.fechaDevolucion == null ? 'Activo' : 'Devuelto'}"></span></td><td class="text-end text-nowrap"><button th:if="${item.fechaDevolucion == null}" class="btn btn-outline-secondary btn-sm" type="button" data-bs-toggle="modal" th:data-bs-target="'#editar-' + ${item.id}">Editar</button> <form th:if="${item.fechaDevolucion == null}" class="d-inline" th:action="@{/vista/prestamos/{id}/devolver(id=${item.id})}" method="post"><button class="btn btn-outline-primary btn-sm" type="submit">Devolver</button></form> <form class="d-inline" th:action="@{/vista/prestamos/{id}/eliminar(id=${item.id})}" method="post"><button class="btn btn-outline-danger btn-sm" type="submit" onclick="return confirm('Eliminar este préstamo?')">Eliminar</button></form></td>
                                    <div class="modal fade" th:id="'editar-' + ${item.id}" tabindex="-1" aria-hidden="true"><div class="modal-dialog"><div class="modal-content"><form th:action="@{/vista/prestamos/{id}/actualizar(id=${item.id})}" method="post"><div class="modal-header"><h3 class="modal-title fs-5">Editar préstamo</h3><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="mb-3"><label class="form-label">Libro</label><select class="form-select" name="isbn" required><option th:each="libro : ${libros}" th:value="${libro.isbn}" th:text="${libro.titulo + ' - disponibles: ' + libro.numeroEjemplares}" th:selected="${libro.isbn == item.libro.isbn}" th:disabled="${libro.numeroEjemplares == 0 and libro.isbn != item.libro.isbn}"></option></select></div><div><label class="form-label">Usuario</label><select class="form-select" name="personaId" required><option th:each="persona : ${personas}" th:value="${persona.id}" th:text="${persona.nombre + ' ' + persona.apellidos}" th:selected="${persona.id == item.socio.id}"></option></select></div></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" type="submit">Guardar cambios</button></div></form></div></div></div>
                                </tr>
                                <tr th:if="${#lists.isEmpty(prestamos)}"><td colspan="7" class="text-center text-secondary py-4">No hay préstamos registrados.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script>
        document.getElementById('buscador').addEventListener('input', function () {
            const query = this.value.toLowerCase();
            document.querySelectorAll('#tablaPrestamos tbody tr').forEach(function (row) {
                row.style.display = row.textContent.toLowerCase().includes(query) ? '' : 'none';
            });
        });
    </script>
</body>
</html>
